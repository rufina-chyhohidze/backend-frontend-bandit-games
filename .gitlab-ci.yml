stages: 
  - build
  - test
    
cache:
  key: "${CI_PROJECT_ID}"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
    - build/

    
variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:21-jdk-alpine
    
build_job:
  stage: build
  image: $DEFAULT_IMAGE_NAME
  script:
    - echo "Compiling backend..."
    - cd backend
    - ./gradlew clean build -x test
      
test_job:
  stage: test
  image: docker:24
  services:
    - name: docker:dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - apk add --no-cache openjdk21
    - cd backend
    - ./gradlew test

