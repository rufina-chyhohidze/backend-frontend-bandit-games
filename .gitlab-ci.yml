include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - package

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cache:
  key: "${CI_PROJECT_ID}"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
    - backend/build/

variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:21-jdk-alpine
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
  TESTCONTAINERS_HOST_OVERRIDE: "docker"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

build_job:
  stage: build
  image: $DEFAULT_IMAGE_NAME
  script:
    - echo "Compiling backend..."
    - cd backend
    - ./gradlew clean build -x test -x spotbugsMain -x spotbugsTest
  artifacts:
    paths:
      - backend/build/libs/
    expire_in: 1 day

test_job:
  stage: test
  image: $DEFAULT_IMAGE_NAME
  services:
    - name: docker:27-dind
  script:
    - cd backend
    - ./gradlew test
  artifacts:
    reports:
      junit: backend/build/test-results/test/*.xml

code_quality_job:
  stage: test
  image: $DEFAULT_IMAGE_NAME
  script:
    - cd backend
    - ./gradlew spotbugsMain spotbugsTest -x test || true
#  remove this line if you want to fail the job on code quality issues
  allow_failure: true
  artifacts:
    when: always
    paths:
      - backend/build/reports/

package_image_job:
  stage: package
  image: $DEFAULT_IMAGE_NAME
  services:
    - name: docker:27-dind
  script:
    - apk add --no-cache docker-cli

    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

    - cd backend

    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        IMAGE_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_REGISTRY_IMAGE:latest"
      fi
      echo "Building and Publishing Image: $IMAGE_TAG"

    - ./gradlew bootBuildImage --publishImage --imageName="$IMAGE_TAG" -x test -x build

  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
