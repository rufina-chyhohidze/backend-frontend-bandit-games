name: kdg

services:

  platform_postgres:
    image: postgres:17.6-alpine
    restart: always
    environment:
      POSTGRES_USER: bandit
      POSTGRES_PASSWORD: bandit
      POSTGRES_DB: banditgames
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5544:5432"
    networks:
      - kdg-backend
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data

  chess_postgres:
    image: postgres:17.6-alpine
    restart: always
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: /var/lib/postgresql/data/pgdata
#    ports:
#      - '5443:5432'        # same as teachers, but we don't need them
    networks:
      - kdg-backend
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d

  app_chessgame_back:
    image: registry.gitlab.com/kdg-ti/integration-5/chessgame/back:latest
    # you usually DON'T need to expose port 8080 on host,
    # chess frontend will call it inside the docker network.
    # If you want to debug it directly, you can use 8082:8080 instead.
    ports:
       - '8080:8080'
    platform: linux/amd64
    networks:
      - kdg-backend
    depends_on:
      - chess_postgres
      - app_rabbitmq
    environment:
      - GAME_REGISTRATION_ID=8496c496-a884-48ed-9bb3-7c3aa50fb8ca
      - DATASOURCE_URL=jdbc:postgresql://chess_postgres:5432/postgres
      - DATASOURCE_USER=user
      - DATASOURCE_PASSWORD=password
      - RABBIT_HOST=app_rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USER=user
      - RABBIT_PASSWORD=password

  app_chessgame_front:
    image: registry.gitlab.com/kdg-ti/integration-5/chessgame/front:latest
    platform: linux/amd64
    depends_on:
      - app_chessgame_back
      - app_rabbitmq
      - chess_postgres
    networks:
      - kdg-backend
    ports:
      - '3333:80'   # you will access chess UI at http://localhost:3333

  gameplay_mongodb:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_DATABASE: gameplay
      MONGO_INITDB_ROOT_USERNAME: user_mongodb
      MONGO_INITDB_ROOT_PASSWORD: password_mongodb
    ports:
      - "27017:27017"
    networks:
      - kdg-backend
    volumes:
      - mongo_data:/data/db
      - ./init-scripts/mongo:/docker-entrypoint-initdb.d

  app_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - kdg-backend
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

  idp_mysql:
    image: mysql:9.0.1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    networks:
      - kdg-kc
    volumes:
      - mysql_data:/var/lib/mysql

  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL_HOST: idp_mysql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
    command: start-dev --import-realm --file /opt/keycloak/data/import/banditgames-realm.json
    depends_on:
      - idp_mysql
    ports:
      - "8180:8080"
    networks:
      - kdg-kc
    volumes:
      - ./realm-export:/opt/keycloak/data/import

  ml_ai_connect4:
    image: registry.gitlab.com/kdg-ti/inf-curriculum/domain-integration/integration-5/2025-2026/team4/dataandai/ml-ai-connect4:latest
    container_name: ml_ai_connect4
    ports:
      - "8082:8082"
    networks:
      - kdg-backend

  mcts_connect4:
    image: registry.gitlab.com/kdg-ti/inf-curriculum/domain-integration/integration-5/2025-2026/team4/dataandai/mcts:latest
    container_name: mcts_connect4
    ports:
      - "8081:8081"
    networks:
      - kdg-backend

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_rag_backend
    environment:
      - OLLAMA_HOST=0.0.0.0:11435
    ports:
      - "11435:11435"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - kdg-backend
    restart: always
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      retries: 5
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_puller
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11435
    entrypoint: [ "/bin/sh", "-c", "ollama pull gemma3:1b" ]

  rag-api:
    image: registry.gitlab.com/kdg-ti/inf-curriculum/domain-integration/integration-5/2025-2026/team4/dataandai:dev
    container_name: rag_fastapi_app
    ports:
      - "7001:7000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11435
    networks:
      - kdg-backend
    restart: always

  connect4_backend:
    image: registry.gitlab.com/kdg-ti/inf-curriculum/domain-integration/integration-5/2025-2026/team4/games/connect4
    container_name: connect4_backend
    ports:
      - "8000:8000"
    networks:
      - kdg-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Java backend URLs
      AI_SERVICE_URL: http://host.docker.internal:8083/api/gameplay/ai-move
      ML_SERVICE_URL: http://host.docker.internal:8083/api/gameplay/ml-move
      JAVA_BACKEND_URL: http://host.docker.internal:8083
      RABBITMQ_HOST: app_rabbitmq

  java_backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: java_backend
    ports:
      - "8083:8083"
    networks:
      - kdg-backend
      - kdg-kc
    depends_on:
      - gameplay_mongodb
      - platform_postgres
      - app_rabbitmq
      - idp_keycloak
    environment:
      # MongoDB
      SPRING_DATA_MONGODB_URI: mongodb://user_mongodb:password_mongodb@gameplay_mongodb:27017/gameplay?authSource=admin

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform_postgres:5432/banditgames
      SPRING_DATASOURCE_USERNAME: bandit
      SPRING_DATASOURCE_PASSWORD: bandit

      # RabbitMQ
      SPRING_RABBITMQ_HOST: app_rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password

      # Keycloak
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/banditgames
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://idp_keycloak:8080/realms/banditgames/protocol/openid-connect/certs

      # CORS (keep localhost for browser access)
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

      # Connect4 Python backend
      CONNECT4_API_URL: http://connect4_backend:8000/game/create

      # ML AI
      AI_CONNECT4_API_URL: http://mcts_connect4:8081/ai
      ML_CONNECT4_API_URL: http://ml_ai_connect4:8082/predict-best-move
      WINPROB_CONNECT4_API_URL: http://ml_ai_connect4:8082/win-probability

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: banditgames_frontend
    ports:
      - "5173:5173"
    networks:
      - kdg-backend
    depends_on:
      - java_backend

networks:
  kdg-kc:
    name: kdg-kc-network
    driver: bridge

  kdg-backend:
    name: kdg-back-network
    driver: bridge

volumes:
  mongo_data:
  rabbitmq_data:
  rabbitmq_logs:
  mysql_data:
  platform_postgres_data:
  ollama_storage: